<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teeny Titans Recomp</title>
<meta name="description" content="Unofficial recomp of Teeny Titans that runs on modern Android. A fan-made preservation project.">
<meta property="og:title" content="Teeny Titans Recomp">
<meta property="og:description" content="Teeny Titans is back, running on modern Android.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff; --off:#f5f8fa; --black:#0a0a0a; --grey:#6b7280; --line:#e5e7eb;
    --blue:#4cc9f0; --blue-dark:#1fa8d6; --blue-soft:#e6f7fd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Space Grotesk",system-ui,sans-serif;background:var(--white);color:var(--black);line-height:1.65;-webkit-font-smoothing:antialiased}
  a{color:var(--blue-dark)}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}
  .mono{font-family:"JetBrains Mono",monospace}

  header{padding:28px 0}
  header .wrap{display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:700;font-size:1rem;letter-spacing:.5px;color:var(--black);text-decoration:none}
  .logo span{color:var(--blue)}

  /* language switch */
  .lang{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--off);border:1px solid var(--line);
    border-radius:999px;padding:3px;cursor:pointer;user-select:none}
  .lang button{position:relative;z-index:1;background:none;border:none;font:inherit;font-size:.78rem;font-weight:700;
    letter-spacing:.5px;padding:6px 14px;color:var(--grey);cursor:pointer;transition:color .2s}
  .lang button.on{color:var(--white)}
  .lang .knob{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:var(--black);
    border-radius:999px;transition:transform .25s cubic-bezier(.4,0,.2,1)}
  .lang[data-lang="pt"] .knob{transform:translateX(100%)}

  /* hero */
  .hero{padding:90px 0 100px}
  .pill{display:inline-block;font-size:.8rem;font-weight:500;color:var(--blue-dark);background:var(--blue-soft);
    padding:5px 12px;border-radius:999px;margin-bottom:26px}
  h1{font-size:clamp(3rem,9vw,5.6rem);font-weight:700;line-height:.95;letter-spacing:-2.5px}
  h1 span{display:block;color:var(--blue)}
  .lead{font-size:1.15rem;color:var(--grey);max-width:540px;margin:28px 0 40px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border-radius:12px;font-weight:700;
    text-decoration:none;font-size:1rem;transition:background .15s,transform .15s}
  .btn-main{background:var(--black);color:var(--white)}
  .btn-main:hover{background:var(--blue-dark);transform:translateY(-2px)}
  .btn-main .arrow{color:var(--blue)}
  .btn-main:hover .arrow{color:var(--white)}
  .meta{display:flex;flex-wrap:wrap;gap:28px;margin-top:34px;font-size:.88rem;color:var(--grey)}
  .meta b{color:var(--black);font-weight:500}

  /* sections */
  section{padding:80px 0;border-top:1px solid var(--line)}
  h2{font-size:1.8rem;font-weight:700;letter-spacing:-.8px;margin-bottom:10px}
  h2::before{content:"";display:inline-block;width:10px;height:10px;background:var(--blue);border-radius:2px;margin-right:12px;vertical-align:middle}
  .sub{color:var(--grey);max-width:580px;margin-bottom:40px}

  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:34px 40px}
  .feat h3{font-size:1.02rem;margin-bottom:4px}
  .feat p{color:var(--grey);font-size:.95rem}

  ol.steps{list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;display:grid;grid-template-columns:44px 1fr;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
  ol.steps li:last-child{border-bottom:none}
  ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--blue-dark)}
  ol.steps h3{font-size:1.05rem;margin-bottom:3px}
  ol.steps p{color:var(--grey)}
  code{font-family:"JetBrains Mono",monospace;background:var(--off);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:.85em;color:var(--black)}

  .dl{background:var(--black);color:var(--white);border-radius:20px;padding:40px;display:grid;grid-template-columns:1.3fr 1fr;gap:34px;align-items:center}
  @media(max-width:720px){.dl{grid-template-columns:1fr;padding:28px}}
  .dl table{width:100%;border-collapse:collapse;font-size:.92rem}
  .dl td{padding:9px 0;border-bottom:1px solid #222}
  .dl td:first-child{color:#9ca3af;width:40%}
  .hash{word-break:break-all;font-size:.76rem;color:var(--blue)}
  .copy{background:none;border:1px solid #333;color:#9ca3af;border-radius:6px;padding:2px 8px;cursor:pointer;font:inherit;font-size:.74rem;margin-left:6px}
  .copy:hover{color:var(--white);border-color:var(--blue)}
  .dl .btn{background:var(--blue);color:var(--black);width:100%;justify-content:center;font-size:1.05rem;padding:18px}
  .dl .btn:hover{background:var(--white);transform:translateY(-2px)}
  .dl .btn-itch{background:none;color:var(--white);border:1.5px solid #333;margin-top:12px;padding:15px;font-size:.98rem}
  .dl .btn-itch:hover{background:none;border-color:var(--blue);color:var(--blue)}
  .dl small{display:block;text-align:center;color:#9ca3af;font-size:.8rem;margin-top:12px}

  details{border-bottom:1px solid var(--line);padding:20px 0}
  summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--blue-dark);font-size:1.3rem;line-height:1;transition:transform .2s}
  details[open] summary::after{transform:rotate(45deg)}
  details p{color:var(--grey);margin-top:10px}

  .log .v{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--blue-dark)}
  .log .d{color:var(--grey);font-size:.85rem;margin-left:10px}
  .log ul{margin:10px 0 32px 18px;color:var(--grey)}
  .log ul:last-child{margin-bottom:0}
  .log li{margin-bottom:4px}

  .shots{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:620px}
  @media(max-width:560px){.shots{gap:16px}}
  .shots figure{margin:0}
  .shots img{width:100%;height:auto;display:block;border-radius:22px;border:1px solid var(--line);
    box-shadow:0 18px 40px -18px rgba(10,10,10,.35);background:var(--off)}
  .shots figcaption{display:flex;gap:10px;margin-top:16px;font-size:.92rem;color:var(--grey)}
  .shots .n{font-family:"JetBrains Mono",monospace;font-weight:600;color:var(--blue-dark);flex:none}

  footer{border-top:1px solid var(--line);padding:40px 0 60px;font-size:.84rem;color:var(--grey)}
  footer .disc{margin-bottom:24px;max-width:640px}
  footer .by{color:var(--black);font-weight:500}
  footer .by .name{color:var(--blue-dark)}
</style>
</head>

  document.querySelectorAll("[data-i18n-alt]").forEach(el => { el.alt = t[el.dataset.i18nAlt]; });
  const fmt = d => new Date(d).toLocaleDateString(t.locale,{day:"numeric",month:"long",year:"numeric"});
  const fmtDate = fmt(CONFIG.date);
  document.querySelectorAll("[data-date]").forEach(el => { el.textContent = fmt(el.dataset.date); });
  $("pill").textContent = `${t.pill} · ${CONFIG.version}`;
  $("dl-date").textContent = fmtDate;
  $("dl-android").textContent = t.androidReq(CONFIG.minAndroid);
  sw.dataset.lang = current;
  sw.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.set === current));
  try { localStorage.setItem("lang", current); } catch(e){}
}

// static values
$("meta-android").textContent = CONFIG.minAndroid + "+";
$("meta-size").textContent = CONFIG.size;
$("meta-arch").textContent = CONFIG.arch;
$("dl-version").textContent = CONFIG.version;
$("dl-size").textContent = CONFIG.size;
$("btn-dl").href = CONFIG.mediafire;
$("btn-itch").href = CONFIG.itch;

// switch: click a side, or anywhere to toggle
sw.addEventListener("click", e => {
  const target = e.target.closest("button");
  setLang(target ? target.dataset.set : (current === "en" ? "pt" : "en"));
});

let saved = null;
try { saved = localStorage.getItem("lang"); } catch(e){}
setLang(saved || "en");
</script>
</body>
</html>
